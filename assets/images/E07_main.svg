<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3a1a"/>
      <stop offset="100%" stop-color="#4a5a2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#B8923F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#B8923F" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="360" fill="url(#bg)"/>
  <rect width="400" height="360" fill="url(#glow)"/>

  <!-- Decorative corner marks -->
  <g stroke="#B8923F" stroke-width="0.8" opacity="0.4" fill="none">
    <path d="M 20 20 L 20 35 M 20 20 L 35 20"/>
    <path d="M 380 20 L 380 35 M 380 20 L 365 20"/>
    <path d="M 20 340 L 20 325 M 20 340 L 35 340"/>
    <path d="M 380 340 L 380 325 M 380 340 L 365 340"/>
  </g>

  <!-- Category symbol (decorative background) -->
  
            <g transform="translate(200, 180)" opacity="0.25" fill="none" stroke="#B8923F" stroke-width="1.5">
                <path d="M -15 -40 L -20 -25 Q -30 0 -25 25 Q -20 40 0 40 Q 20 40 25 25 Q 30 0 20 -25 L 15 -40 Z"/>
                <path d="M -15 -40 Q 0 -45 15 -40"/>
                <path d="M -25 -10 Q 0 -5 25 -10" stroke-dasharray="2,2"/>
            </g>

  <!-- ID badge -->
  <g transform="translate(20, 25)">
    <rect width="42" height="22" rx="1" fill="#B8923F" opacity="0.9"/>
    <text x="21" y="16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#2d3a1a" font-weight="700">E07</text>
  </g>

  <!-- Category label (top right) -->
  <g transform="translate(380, 30)">
    <text x="0" y="0" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#B8923F" opacity="0.8" letter-spacing="1">海上贸易与文化</text>
  </g>

  <!-- Exhibit name (centered, main title) -->
  <text x="200" y="155" text-anchor="middle" font-family="LXGW WenKai, serif" font-size="26" font-weight="700" fill="#F4EBD8" filter="url(#softShadow)" letter-spacing="2">
    <tspan x="200" dy="0">元基督教四翼天使石刻</tspan>
  </text>

  <!-- Decorative rule under name -->
  <line x1="160" y1="200" x2="240" y2="200" stroke="#B8923F" stroke-width="1" opacity="0.6"/>
  <circle cx="200" cy="200" r="2" fill="#B8923F" opacity="0.8"/>

  <!-- Museum name -->
  <text x="200" y="290" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#F4EBD8" opacity="0.75" letter-spacing="1">
    泉州海外交通史博物馆
  </text>

  <!-- Bottom decorative rule -->
  <line x1="100" y1="325" x2="300" y2="325" stroke="#B8923F" stroke-width="0.5" opacity="0.3"/>
</svg>